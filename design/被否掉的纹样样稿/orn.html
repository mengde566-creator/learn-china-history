<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#101318;font-family:"Songti SC",STSong,serif;padding:40px;color:#ece7dd}
h2{font-size:13px;letter-spacing:.2em;font-weight:400;color:#8d949e;margin:26px 0 12px}
h2:first-child{margin-top:0}
.box{background:#e7e2d7;padding:26px;border-radius:3px;display:inline-block}
.card{width:300px;height:172px;border-radius:3px;position:relative;overflow:hidden;
  background-color:#e7e2d7;background-image:url('/textures/paper.svg');
  background-size:280px 280px;background-blend-mode:multiply;
  box-shadow:0 1px 0 rgba(0,0,0,.16), 0 10px 26px -14px rgba(0,0,0,.5);padding:26px 28px}
.card::after{content:'';position:absolute;right:-14px;bottom:-16px;width:206px;height:158px;
  background:url(ornament.svg) right bottom / contain no-repeat;opacity:.34}
.nm{font-size:22px;letter-spacing:.12em;color:#26231e;margin-bottom:10px}
.bk{font-size:12px;color:#4a4438;margin-bottom:14px}
.mt{font-size:11.5px;color:#605949}
.sheet{width:560px;border-radius:3px;overflow:hidden;position:relative;
  background-color:#e7e2d7;background-image:url('/textures/paper.svg');
  background-size:280px 280px;background-blend-mode:multiply;
  box-shadow:0 1px 0 rgba(0,0,0,.16), 0 14px 34px -18px rgba(0,0,0,.55)}
.sheet::after{content:'';position:absolute;right:-16px;bottom:-18px;width:250px;height:190px;
  background:url(ornament.svg) right bottom / contain no-repeat;opacity:.30}
.srow{padding:17px 26px;border-bottom:1px solid rgba(0,0,0,.07)}
.srow:last-child{border-bottom:none}
.sq{font-size:15.5px;color:#26231e;margin-bottom:4px}
.snm{font-size:11.5px;letter-spacing:.14em;color:#4a4438}
</style></head><body>
<h2>构 图 本 身</h2>
<div class="box"><img src="ornament.svg" width="510"></div>
<h2>卡 片</h2>
<div class="card"><div class="nm">荆轲</div><div class="bk">《史记·刺客列传》</div><div class="mt">8 篇</div></div>
<h2>故 事 列 表</h2>
<div class="sheet">
  <div class="srow"><div class="sq">秦军破了赵国，兵锋已到燕国南界</div><div class="snm">燕国危局</div></div>
  <div class="srow"><div class="sq">深秋，易水。送行的人都穿着白衣白冠</div><div class="snm">易水送别 ★</div></div>
  <div class="srow"><div class="sq">地图卷到了头</div><div class="snm">图穷匕见</div></div>
</div>
</body></html>
