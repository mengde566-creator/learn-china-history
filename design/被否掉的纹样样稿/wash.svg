<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340">
  <defs>
    <filter id="w" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="4" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="86" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="2.4"/>
    </filter>
    <radialGradient id="fade" cx="100%" cy="100%" r="86%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="520" height="340" fill="url(#fade)"/></mask>
  </defs>
  <g mask="url(#m)">
    <ellipse cx="430" cy="255" rx="210" ry="130" fill="#6b5a3e" opacity=".5" filter="url(#w)"/>
    <ellipse cx="500" cy="320" rx="150" ry="95" fill="#5a4a32" opacity=".42" filter="url(#w)"/>
  </g>
</svg>
